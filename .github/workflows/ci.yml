name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Audit, Lint, Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist
          retention-days: 3

  e2e-offline-and-lighthouse:
    name: Offline PWA E2E & Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Install Playwright Chromium for offline E2E
        run: npx --yes playwright install --with-deps chromium

      - name: Run Offline PWA E2E test (Log meal -> Offline -> Reload)
        run: node scripts/e2e-offline.mjs

      - name: Run Lighthouse CI audit
        run: npx --yes @lhci/cli@0.15.x autorun
        continue-on-error: true
